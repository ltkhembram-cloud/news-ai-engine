[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "news-ai-engine"
version = "1.0.0"
description = "Autonomous Multi-Source News Verification, Recommendation & Editorial SDK"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Subhadeep", email = "mardi-7x@users.noreply.github.com" }
]
dependencies = [
    "groq>=0.11.0",
    "openai>=1.0.0",
    "tavily-python>=0.5.0",
    "feedparser>=6.0.0",
    "requests>=2.28.0",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10.0",
    "nest_asyncio>=1.6.0"
]

[project.urls]
Repository = "[https://github.com/mardi-7x/news-ai-engine](https://github.com/mardi-7x/news-ai-engine)"
